  baseURL = "https://knr.edu.pl/"
languageCode = "pl-pl"
title = "Koło Naukowe Robotyków PW"

[markup.goldmark.renderer]
unsafe= true

[project]
title = "Project"
singular = "project"
plural = "projects"

[article]
title = "Artykuł"
singular = "article"
plural = "articles"

[sponsors]
title = "Sponsorzy"
singular = "sponsors"
plural = "sponsors"

[[cascade]]
  [cascade._build]
    render = "never"
    list = "always"
  [cascade._target]
    path = "/sponsors/**"

[module]
[[module.mounts]]
    target = "assets/images"
    source = "static/images"

[params]
  [params.project]
    title = 'Projekty KNR'
