# do testowania lokalnego
local_backend: true #https://decapcms.org/docs/beta-features/#working-with-a-local-git-repository

locale: "pl"

backend:
  name: github
  branch: main
  repo: KNR-PW/knr-pw.github.io

#TODO zmiana położenia obrazów
media_folder: "static/images"
public_folder: "/images"

# Składnia kolekcji: https://decapcms.org/docs/configuration-options/#collections
collections:
  - name: "project" # Used in routes, e.g., /admin/collections/blog
    label: "Projekt" # Used in the UI
    description: "Projekty realizowane przez koło"
    folder: "content/project/" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in front matter desccriptions: https://decapcms.org/docs/widgets/
      - {label: "Title", name: "title", widget: "string", required: true, hint: "Nazwa projektu"}
      - {label: "Pokaż na głównej", name: "short_description", widget: "boolean", required: true, hint: "Czy pokazać projekt na stronie głównej koła", default: false}
      - {label: "Priorytet na głównej stronie", name: "main_site_priority", widget: "number", default: 10, value_type: "int", min: 1, max: 100, step: 1, required: false, hint: "1 = pierwszy od góry"}
      - {label: "Opis na głównej stronie", name: "main_site_item_descr", widget: "text", hint: "Krótki opis projektu, który pojawi się na stronie głównej koła (o się tam znajdzie)", required: false}
      - {label: "Data rozpoczęcia projektu", name: "start_date", widget: "string", required: false}
      - {label: "Data zakończenia projektu", name: "end_date", widget: "string", hint: "Wypełnij tylko, jeśli projekt jest już zakończony", required: false}
      - {label: "Body", name: "body", widget: "markdown", required: false}
      - label: "Zdjęcia do galerii projektu"
        name: "gallery_images"
        widget: "list"
        summary: "{{image}}"
        required: false
        fields:
          - {label: "Zdjęcie", name: "image", widget: "image", required: true}
          - {label: "Opis zdjęcia", name: "description", widget: "string", required: false}

      - label: "Zdjęcia wyświetlane na głównej stronie"
        name: "main_site_item_images"
        widget: "list"
        required: true
        summary: "{{image}}"
        fields:
          -  {label: "Zdjęcie", name: "image", widget: "image", required: true, choose_url: true}
      #TODO dodać listę obrazków na główną
  - name: "article" # Used in routes, e.g., /admin/collections/blog
    label: "Artykuł" # Used in the UI
    description: "Inne artykuły na stronie"
    folder: "content/article/" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    fields: # The fields for each document, usually in front matter desccriptions: https://decapcms.org/docs/widgets/
      - {label: "Title", name: "title", widget: "string", required: true, hint: "Nazwa projektu"}
      - {label: "Body", name: "body", widget: "markdown", required: false}
  - name: "sponsors" # Used in routes, e.g., /admin/collections/sponsors
    label: "Sponsorzy" # Used in the UI
    description: "Sponsorzy koła i projektów"
    folder: "content/sponsors/" # The path to the folder where the documents are stored
    create: true # Allow users to create new documents in this collection
    identifier_field: "title"
    summary: "{{title}}"
    fields: # The fields for each document, usually in front matter descriptions: https://decapcms.org/docs/widgets/
      - {label: "Nazwa sekcji", name: "title", widget: "string", required: true, hint: "Nazwa wyświetlana na liście w panelu (np. KNR, KNR Rover Team, KNR Drone)"}
      - label: "Sekcja"
        name: "section"
        widget: "select"
        required: true
        default: "KNR"
        hint: "Wybierz 'KNR' dla sponsorów ogólnokołowych lub nazwę aktywnej sekcji/projektu"
        options:
          - {label: "KNR (ogólnokołowi)", value: "KNR"}
          - {label: "KNR Rover Team", value: "KNR Rover Team"}
          - {label: "KNR Drone", value: "KNR Drone"}
          - {label: "Zespół Robotów Kroczących", value: "Zespół Robotów Kroczących"}
      - label: "Sponsorzy"
        name: "sponsors"
        widget: "list"
        allow_add: true
        required: false
        summary: "Wiersz {{fields.row}}.{{fields.order}} — {{fields.name}}"
        fields:
          - {label: "Nazwa sponsora", name: "name", widget: "string", required: true, hint: "Nazwa sponsora"}
          - {label: "Aktualny", name: "aktualne", widget: "boolean", default: true, required: false, hint: "Jeśli zaznaczone — wyświetla się normalnie w 'Wspierają nas'. Jeśli odznaczone — trafia do karuzeli 'Zaufali nam'."}
          - {label: "Premium (tylko dla KNR)", name: "premium", widget: "boolean", default: false, required: false, hint: "Dotyczy wyłącznie sponsorów ogólnokołowych (KNR) — wyświetla sponsora nad wszystkimi sekcjami tuż pod 'Wspierają nas'."}
          - {label: "Logo sponsora", name: "logo", widget: "image", required: true, choose_url: true, hint: "Logo sponsora"}
          - {label: "Link do strony sponsora", name: "link", widget: "string", required: false, hint: "Link do strony sponsora"}
          - {label: "Wiersz", name: "row", widget: "number", value_type: "int", min: 1, step: 1, default: 1, required: true, hint: "Numer wiersza (1 = pierwszy od góry)"}
          - {label: "Kolejność w wierszu", name: "order", widget: "number", value_type: "int", min: 1, step: 1, default: 1, required: true, hint: "Kolejność w wierszu (1 = pierwszy od lewej)"}
          - {label: "Klasa", name: "class", widget: "select", required: false, default: "sponsor--small", options: ["sponsor--main", "sponsor--big", "sponsor--mediumbig", "sponsor--medium", "sponsor--small"], hint: "Klasa rozmiaru sponsora (opcjonalna, jeśli podano własny Style; pomijana w karuzeli 'Zaufali nam')"}
          - {label: "Style", name: "style", widget: "string", required: false, hint: "Css style dla sponsora, np. 'width: 100px; height: 100px;' (pomijane w karuzeli 'Zaufali nam')"}